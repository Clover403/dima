<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Force every (re)load to start at scroll=0 BEFORE React mounts so that
      // components' useLayoutEffect measurements always run at the same
      // deterministic position. Otherwise the browser restores the previous
      // scroll, components measure at scroll=N, and the resulting ScrollTrigger
      // pin/trigger positions are stale once we later snap back to top.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/logo/orange.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMA Finance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
